services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sofsavdo
      POSTGRES_PASSWORD: sofsavdo
      POSTGRES_DB: sofsavdo
    ports:
      - "5432:5432"
    volumes:
      - sofsavdo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sofsavdo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sofsavdo_postgres_data:
