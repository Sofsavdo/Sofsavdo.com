# Railway service config for the web app. Assumes this service's "Root Directory" (dashboard) is
# left at the monorepo root ("/"), NOT "apps/web" — apps/web/Dockerfile needs the repo root as
# its Docker build context (it depends on the workspace-internal @sofsavdo/config/types/ui packages
# living alongside it). dockerfilePath below is relative to that root directory. See
# DEPLOYMENT.md for the full Railway project setup.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/web/Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
