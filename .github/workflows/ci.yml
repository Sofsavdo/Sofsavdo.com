name: CI

# Runs on every push and PR (the quality gate) — Phase 14 §14: a production deployment must be
# blocked if typecheck, lint, tests, migrations, or build fail. `workflow_call` lets deploy.yml
# reuse these exact same jobs as its own pre-deploy gate instead of duplicating them.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  api:
    name: API — typecheck, lint, unit + e2e tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rosti
          POSTGRES_PASSWORD: rosti
          POSTGRES_DB: rosti_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rosti"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable CI-only values — never real secrets, never a real deploy target. Same shape as
      # apps/api/.env.test.example, just pointed at this job's own service containers.
      DATABASE_URL: postgresql://rosti:rosti@localhost:5432/rosti_ci
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate --workspace=@rosti/api

      - name: Prisma validate
        run: npm run prisma:validate --workspace=@rosti/api

      - name: Typecheck
        run: npm run typecheck --workspace=@rosti/api

      - name: Lint
        run: npm run lint --workspace=@rosti/api

      - name: Apply migrations to the CI database
        run: npm run prisma:migrate:deploy --workspace=@rosti/api

      - name: Unit tests
        run: npm run test:unit --workspace=@rosti/api

      - name: E2E tests
        run: npm run test:e2e --workspace=@rosti/api

      - name: Build
        run: npm run build --workspace=@rosti/api

  web:
    name: Web — typecheck, lint, build
    runs-on: ubuntu-latest
    env:
      # NEXT_PUBLIC_* are inlined into the client bundle at build time — these CI-only values are
      # never shipped anywhere real; a genuine deploy sets its own via the Docker build ARGs
      # (see apps/web/Dockerfile and DEPLOYMENT.md).
      NEXT_PUBLIC_API_MODE: real
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=@rosti/web

      - name: Lint
        run: npm run lint --workspace=@rosti/web

      - name: Build
        run: npm run build --workspace=@rosti/web
